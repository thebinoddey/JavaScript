<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>
<body>
    <h1>Hello World</h1>
    <p>Learning JavaScript DOM</p>
    <button>Click Me</button>
</body>

<script>
    // JavaScript uses the global document object to interact with the webpage.
    console.log(document);

    //Imp Props:
    console.log(document.title); //My Website
    console.log(document.URL); //URL of the html page
    console.log(document.body); //accesses body element
    console.log(document.head); //accesses head element
    console.log(document.documentElement); //accesses html element

    
</script>
</html>
